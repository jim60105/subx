[package]
name = "subx"
version = "0.1.0"
description = "Desktop GUI for subx-cli — AI-powered subtitle matching"
authors = ["Jim Chen <Jim@ChenJ.im>"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "subx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subx-cli = "1.7"
# Pinned to exact versions, not caret ranges: these are pre-1.0 and load-bearing
# for every command path, so an RC bump must be a deliberate act with its own
# diff rather than something a `cargo update` performs silently.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
# The `test` feature unlocks `tauri::test`'s mock runtime, which is the only way
# to reach the `#[tauri::command]` wrappers: they take `State<AppState>`, which
# cannot exist without a running app.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
