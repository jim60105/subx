[package]
name = "subx"
version = "0.1.0"
description = "Desktop GUI for subx-cli — AI-powered subtitle matching"
authors = ["Jim Chen <Jim@ChenJ.im>"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "subx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subx-cli = "1.9"
# Pinned to exact versions, not caret ranges: these are pre-1.0 and load-bearing
# for every command path, so an RC bump must be a deliberate act with its own
# diff rather than something a `cargo update` performs silently.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# Native file/folder picker for the match wizard's Step 1 "Browse" action.
tauri-plugin-dialog = "2"

[dependencies.tokio]
# The wizard's analysis runs in a spawned task whose plan state is guarded by a
# `tokio::sync::Mutex` (writers hold it across `.await`), so `sync` must be an
# explicit feature here — it is otherwise only a transitive dependency of tauri.
version = "1"
features = ["sync", "rt"]

[dev-dependencies]
# The `test` feature unlocks `tauri::test`'s mock runtime, which is the only way
# to reach the `#[tauri::command]` wrappers: they take `State<AppState>`, which
# cannot exist without a running app.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
# Implements the crate's `#[async_trait]` `AIProvider` for the tests' scripted
# provider, the seam that drives `analyze_sources` end to end without a live AI:
# the crate assigns file IDs at scan time, so a static HTTP mock cannot echo the
# IDs a match must reference — a provider that reads them off the request can.
async-trait = "0.1"
# Writes a real `.zip` so the archive-source scenario is tested through the
# crate's actual extraction path, not mocked. Pinned to the same major the crate
# resolves, so no second copy of `zip` enters the tree.
zip = "8"
# Serializes a complete, valid config file for the tolerant-read tests, pinned
# to the same major the crate resolves (no second copy of `toml`).
toml = "1"
