<!--
  SubX brand mark — monochrome, plate-less. Nothing in the app-icon change
  consumes this file; it exists so the README and header work later start from a
  drawing that is already in register with the master.

  Source of truth: openspec/changes/archive/2026-08-23-subx-app-icon/design.md §1.4 (geometry) and
  §1.7 (why this variant drops the weave). Same viewBox and the same four
  constants as the master: t = 68, R_long = 150, R_short = 105, g = 22.

  Two deliberate differences from the master:
    1. No plate and no rim, and therefore NO weave knockout. On a transparent
       background there is nothing behind the gap for the knockout to reveal, so
       it would simply cut a hole in the mark (design.md §1.7).
    2. Having lost its plate, the mark is drawn at 1.15x about the centre so it
       fills a transparent square the way the full mark fills its tile.

  Paint is `currentColor`, so theme behaviour follows the host's `data-theme`
  flip with no second asset and no extra CSS.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" stroke="currentColor">
  <g transform="translate(256,256) scale(1.15) translate(-256,-256)">
    <!-- Band A — long, ascending, the media track. -->
    <line x1="149.93" y1="362.07" x2="362.07" y2="149.93" stroke-width="68" stroke-linecap="round"/>

    <!-- Band B — short, descending, the subtitle cue. -->
    <line x1="181.75" y1="181.75" x2="330.25" y2="330.25" stroke-width="68" stroke-linecap="round"/>
  </g>
</svg>
