schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  tasks:
    - Every new `#### Scenario:` this change adds to a spec must be verified by a
      test carrying a `// @covers <scenario-id>` annotation, or exempted by a
      justified waiver in `scripts/spec-coverage.config.json`. Include the
      annotation work in the tasks. See docs/verification.md.
    - New source counts against the 85% coverage floor in both languages; close
      the gap with tests rather than widening a coverage exclusion list.
