# Verification gates.
#
# This project has no pull-request flow, so `push` is the only trigger and CI is
# a post-hoc alarm rather than a merge barrier: a red commit is already on the
# branch by the time this reports. The local `npm run verify` is the primary
# defence — it bundles exactly these gates — and this pipeline is the backstop
# that catches a gate someone skipped locally.
name: CI

on: push

jobs:
  frontend:
    name: Frontend (typecheck + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage

  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Backend coverage gate
        working-directory: src-tauri
        run: cargo cov

  traceability:
    name: Spec-to-test traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No install step: the checker depends only on the Node standard library,
      # so this is the gate contributors trip most often and it returns first.
      - run: node scripts/check-spec-coverage.mjs
