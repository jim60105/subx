# Verification gates.
#
# This project has no pull-request flow, so `push` is the only trigger and CI is
# a post-hoc alarm rather than a merge barrier: a red commit is already on the
# branch by the time this reports. The local `npm run verify` is the primary
# defence — it bundles exactly these gates — and this pipeline is the backstop
# that catches a gate someone skipped locally.
name: CI

on: push

jobs:
  frontend:
    name: Frontend (typecheck + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage
      - name: Upload frontend test results to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          flags: frontend
          report_type: test_results
          name: frontend-test-results

  backend:
    name: Backend (tests + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev
      # Only so the drift gate below can run the same npm script `npm run
      # verify` does, rather than a second copy of the command that could drift
      # from it. No `npm ci`: the script shells out to cargo and git.
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Backend coverage gate
        working-directory: src-tauri
        run: cargo llvm-cov nextest --lib --lcov --output-path lcov.info --fail-under-lines 85 --fail-under-functions 85 --fail-under-regions 85 --ignore-filename-regex "(^|/)(main|lib)\.rs$|/rustlib/"
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src-tauri/lcov.info
          flags: backend
          name: backend-coverage
      - name: Upload backend test results to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./src-tauri/target/nextest/default/junit.xml
          flags: backend
          report_type: test_results
          name: backend-test-results
      # A step in this job rather than a job of its own: regenerating the
      # bindings compiles the `tauri` crate, so a separate job would pay this
      # job's apt-install and build cost a second time for one `git diff`.
      - name: IPC bindings drift gate
        run: npm run bindings:check

  traceability:
    name: Spec-to-test traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      # No install step: the checker depends only on the Node standard library,
      # so this is the gate contributors trip most often and it returns first.
      - run: node scripts/check-spec-coverage.mjs
